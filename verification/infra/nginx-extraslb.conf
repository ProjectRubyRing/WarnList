# extraslb-test: 自己署名ルート CA (ExtraSLB Test Root CA) が発行した証明書で HTTPS を返すテストサーバ
server {
    listen 443 ssl;
    server_name extraslb-test;
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    location / {
        default_type text/plain;
        return 200 "EXTRASLB-OK\n";
    }
}
